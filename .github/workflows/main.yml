name: Android release APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_PATH: app/build/outputs/apk/release/app-release.apk

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-36
            platforms;android-35
            build-tools;36.0.0
            platform-tools
            cmake;3.22.1
            ndk;27.2.12479018

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair \
            -keystore app/release.jks \
            -storepass aimbot123456 \
            -keypass aimbot123456 \
            -alias aimbot \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI Build, OU=Android, O=Aimbot, L=Unknown, ST=Unknown, C=US"

      - name: Validate Gradle configuration
        run: ./gradlew --no-daemon help

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease --stacktrace

      - name: Verify APK output
        run: |
          test -f "$APK_PATH"
          file "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          sha256sum "$APK_PATH"

      - name: Upload APK as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aimbot-release-apk-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Create GitHub Release with direct APK asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.1-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aimbot Android $TAG" \
            --generate-notes
