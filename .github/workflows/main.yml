name: Android build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 platform-tools cmake;3.22.1 ndk;27.2.12479018'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create CI signing keystore
        run: |
          keytool -genkeypair \
            -keystore app/release.jks \
            -storepass aimbot123456 \
            -keypass aimbot123456 \
            -alias aimbot \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CI Build, OU=Android, O=Aimbot, L=Unknown, ST=Unknown, C=US"

      - name: Validate Gradle configuration
        run: ./gradlew --no-daemon help

      - name: Run checks and build release APK
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aimbot-release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
